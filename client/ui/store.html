<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Add-on Store</title>
<style>
:root{--navy:#002854;--navy2:#0a3a6b;--blue:#00A0FB;--green:#00EB86;--ink:#1f2a37;--slate:#6b7a8c;--line:#e1e7ee;--soft:#f2f6fa;--sel:#e8f4fe}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Segoe UI Variable Text","Segoe UI",Arial,sans-serif;color:var(--ink);background:#fff;font-size:13px;overflow:hidden;user-select:none}
button{font:inherit;cursor:pointer}
.app{display:flex;flex-direction:column;height:100%}
header{background:var(--navy);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:10px;flex:none}
header .t{font-size:17px;font-weight:600}
header .s{font-size:12px;color:#9fd8ff}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--navy2);border-radius:8px;padding:7px 11px;width:280px}
.search input{all:unset;font-size:13px;color:#fff;width:100%;user-select:text}
.search input::placeholder{color:#9fb8d4}
.hbtn{background:transparent;color:#fff;border:1px solid #4d6f96;border-radius:8px;padding:6px 12px;font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.hbtn:hover{background:var(--navy2)}
.hbtn .ok{color:var(--green);font-weight:700}
.chip.cust{border-color:var(--blue)}
.chip.cust.on{background:var(--blue);border-color:var(--blue)}
.codemsg{font-size:12.5px;margin-top:10px;line-height:1.5}
.codemsg.ok{color:#016839}.codemsg.bad{color:#B3261E}
.accent{height:3px;background:var(--blue);flex:none}
.banner{font-size:12.5px;padding:8px 18px;display:flex;align-items:center;gap:10px;flex:none}
.banner.upd{background:#fff8e1;color:#634E12}
.banner.err{background:#FFBDBD;color:#421F1F}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px 6px;flex:none}
.chip{font-size:12px;padding:4px 12px;border-radius:999px;border:1px solid #c9d3df;background:#fff;color:var(--navy)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.main{flex:1;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);min-height:0}
.list{overflow-y:auto;padding:4px 10px 14px;border-right:1px solid var(--line)}
.card{display:flex;gap:12px;padding:10px 12px;border-radius:10px;border:1px solid transparent;align-items:center;margin-bottom:2px}
.card:hover{background:var(--soft)}
.card.sel{background:var(--sel);border-color:var(--blue)}
.tile{width:42px;height:42px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:15px;overflow:hidden;background:var(--navy)}
.tile img{width:100%;height:100%;object-fit:contain;background:#fff}
.tile.big{width:64px;height:64px;border-radius:14px;font-size:22px}
.cbody{min-width:0;flex:1}
.cname{display:flex;gap:8px;align-items:center;min-width:0}
.cname span:first-child{font-size:14px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdesc{font-size:12px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap;flex:none}
.p-inst{background:#B6FFDE;color:#016839}.p-upd{background:#FFDF85;color:#634E12}.p-beta{background:#e3e8ff;color:#26215C}
.p-cust{background:#d9f1ff;color:#002854;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.banner.need{background:var(--soft);color:var(--navy)}
.reason{font-size:12px;color:var(--navy);margin-top:2px;white-space:normal}
.btn{border:0;border-radius:8px;padding:8px 16px;font-size:13px;background:var(--navy);color:#fff;white-space:nowrap}
.btn:hover{background:#00366f}
.btn.sec{background:#fff;color:var(--navy);border:1px solid #c9d3df}
.btn.sec:hover{background:var(--soft)}
.btn.sm{padding:5px 12px;font-size:12px}
.btn:disabled{opacity:.55;cursor:default}
.detail{overflow-y:auto;padding:18px 20px}
.dhead{display:flex;gap:14px;align-items:center}
.dname{font-size:19px;font-weight:600;color:var(--navy)}
.dmeta{font-size:12px;color:var(--slate);margin-top:2px}
.ddesc{font-size:13px;line-height:1.6;margin:14px 0;user-select:text;white-space:pre-wrap}
.news{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;user-select:text}
.news b{display:block;color:var(--navy);margin-bottom:3px}
.who{display:flex;gap:8px;align-items:center;margin:14px 0 4px;font-size:12px;color:var(--slate);flex-wrap:wrap}
.link{color:var(--blue);text-decoration:none;cursor:pointer}
.link:hover{text-decoration:underline}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.hint{font-size:11.5px;color:var(--slate);margin-top:12px;display:flex;gap:6px;align-items:flex-start}
.empty{padding:28px 12px;color:var(--slate);font-size:13px;text-align:center}
footer{border-top:1px solid var(--line);padding:8px 18px;font-size:11.5px;color:var(--slate);display:flex;gap:10px;align-items:center;flex:none}
footer .grow{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.veil{position:fixed;inset:0;background:rgba(0,20,45,.45);display:none;align-items:center;justify-content:center;z-index:10}
.veil.on{display:flex}
.modal{background:#fff;border-radius:12px;padding:20px 22px;width:min(460px,90vw);max-height:80vh;overflow:auto;box-shadow:0 18px 50px rgba(0,20,50,.35)}
.modal h3{margin:0 0 8px;font-size:16px;color:var(--navy)}
.modal p{margin:0 0 6px;line-height:1.55;white-space:pre-wrap;user-select:text}
.modal .acts{justify-content:flex-end}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid #d6e4f2;border-top-color:var(--blue);animation:r 0.9s linear infinite;margin:0 auto 12px}
@keyframes r{to{transform:rotate(360deg)}}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stars{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--slate)}
.stars i{font-style:normal;letter-spacing:1px;background:linear-gradient(90deg,#FFC600 var(--p),#D9DFE6 var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}
.stars b{color:var(--navy)}
.cstars{margin-top:3px}
.rate{display:flex;align-items:center;gap:10px;margin:14px 0 0;font-size:12px;color:var(--slate);flex-wrap:wrap}
.rate .st{display:inline-flex}
.rate button{all:unset;cursor:pointer;font-size:20px;line-height:1;color:#D9DFE6;padding:0 1px}
.rate button.on{color:#FFC600}
.rate button:focus-visible{outline:2px solid var(--blue);border-radius:3px}
.shots{display:flex;gap:10px;overflow-x:auto;margin:14px 0 2px;padding-bottom:6px}
.shots button{all:unset;cursor:zoom-in;flex:none;width:200px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.shots button:hover{border-color:var(--blue)}
.shots img{display:block;width:200px;height:125px;object-fit:cover;background:var(--soft)}
.shots span{display:block;font-size:11px;color:var(--slate);padding:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal.wide{width:min(1100px,94vw)}
.modal.wide img{display:block;max-width:100%;max-height:70vh;margin:0 auto}
.form label{display:block;font-size:12px;color:var(--slate);margin:10px 0 4px}
.form textarea,.form input[type=email],.form input[type=text]{width:100%;font:inherit;border:1px solid #c9d3df;border-radius:8px;padding:8px 10px;user-select:text}
.form textarea{min-height:120px;resize:vertical}
.form .kinds{display:flex;gap:14px;margin-top:4px}
.form .kinds label,.form .chk{display:flex;gap:6px;align-items:center;margin:0;color:var(--ink);font-size:13px}
.form .chk{margin-top:10px}
.form .note{font-size:11.5px;color:var(--slate);margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <header>
    <svg class="i" style="width:24px;height:24px;color:var(--green)" viewBox="0 0 24 24"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg>
    <span class="t" id="title"></span>
    <span class="s">Tungsten Power PDF</span>
    <label class="search">
      <svg class="i" style="color:#9fd8ff" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" autocomplete="off" spellcheck="false">
    </label>
    <button class="hbtn" id="codeBtn" type="button"></button>
  </header>
  <div class="accent"></div>
  <div class="banner upd" id="upd" style="display:none">
    <svg class="i" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg>
    <span id="updText"></span>
    <button class="btn sec sm" style="margin-left:auto" id="updBtn"></button>
  </div>
  <div class="banner err" id="err" style="display:none"></div>
  <div class="banner need" id="need" style="display:none"><span id="needText"></span><button class="btn sec sm" style="margin-left:auto" id="needAll"></button></div>
  <div class="banner upd" id="lock" style="display:none"></div>
  <div class="chips" id="chips"></div>
  <div class="main">
    <div class="list" id="list"></div>
    <div class="detail" id="detail"></div>
  </div>
  <footer>
    <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
    <span class="grow" id="disc"></span>
    <a class="link" id="discLink"></a>
  </footer>
</div>
<div class="veil" id="veil"><div class="modal" id="modal"></div></div>
<script>
"use strict";
var S = {}, items = [], self = null, sel = null, cat = "", busy = false, locked = false, icons = {}, shots = {}, shotsAsked = {};
var need = null;   // {q, order: [ids], reasons: {id: text}} while a search by need is shown
var code = { has: false, locked: false, customer: "", open: false };   // customer code (C0.8.0)
var CUST = "customer";   // chip key of the delivered add-ons (no category slug can look like this)
function customerName() { var x = items.filter(function (i) { return i.customer; })[0]; return x ? x.customer : code.customer; }
var host = window.chrome && window.chrome.webview;
function post(m) { if (host) host.postMessage(m); }
function $(id) { return document.getElementById(id); }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function fmt(s) { var a = Array.prototype.slice.call(arguments, 1), i = 0; return String(s || "").replace(/%[sd]/g, function () { return a[i++] != null ? String(a[i - 1]) : ""; }).replace(/\\n/g, "\n"); }
function status(x) { return !x.installed ? "none" : x.update ? "upd" : "inst"; }
var palette = ["#002854", "#0F6E56", "#534AB7", "#993C1D", "#185FA5", "#3B6D11"];
function tile(x, big) {
  var t = el("div", "tile" + (big ? " big" : ""));
  if (icons[x.id]) { var img = el("img"); img.src = icons[x.id]; img.alt = ""; t.appendChild(img); }
  else {
    var h = 0; for (var i = 0; i < x.category.length; i++) h = (h * 31 + x.category.charCodeAt(i)) >>> 0;
    t.style.background = palette[h % palette.length];
    t.textContent = x.name.split(/\s+/).map(function (w) { return w.charAt(0); }).join("").slice(0, 2).toUpperCase();
  }
  return t;
}
function stars(avg, count) {
  if (!count) return null;
  var w = el("span", "stars"), i = el("i", "", "\u2605\u2605\u2605\u2605\u2605");
  i.style.setProperty("--p", Math.round(avg / 5 * 100) + "%");
  w.appendChild(i); w.appendChild(el("b", "", Number(avg).toFixed(1))); w.appendChild(el("span", "", "(" + count + ")"));
  w.title = fmt(S.ratings, count);
  return w;
}
function pill(x) {
  var s = status(x);
  if (s === "inst") return el("span", "pill p-inst", S.stInstalled);
  if (s === "upd") return el("span", "pill p-upd", S.stUpdate);
  if (x.channel === "beta") return el("span", "pill p-beta", S.beta);
  return null;
}
function custPill(x) {
  if (!x.customer) return null;
  var p = el("span", "pill p-cust", fmt(S.forCustomer, x.customer)); p.title = p.textContent;
  return p;
}
function actionButtons(x, small) {
  var s = status(x), out = [];
  if (locked) return out;
  function b(label, cls, fn) { var e = el("button", "btn" + (cls ? " " + cls : "") + (small ? " sm" : ""), label); e.disabled = busy; e.onclick = function (ev) { ev.stopPropagation(); fn(); }; out.push(e); }
  if (x.needsHost) {
    // needs a newer Power PDF: no install or update offered, only the reason
    out.push(el("span", "chip" + (small ? " sm" : ""), fmt(S.needsHost, x.needsHost)));
  } else {
    if (s === "none") b(S.install, "", function () { confirmAct("install", x); });
    if (s === "upd") b(S.update, "", function () { confirmAct("install", x); });
  }
  if (s === "inst" || (s === "upd" && !small)) b(S.remove, "sec", function () { confirmAct("uninstall", x); });
  return out;
}
function visible() {
  if (need) {
    return need.order.map(function (id) { return items.filter(function (x) { return x.id === id; })[0]; })
                     .filter(function (x) { return x && (!cat || (cat === CUST ? x.customer : x.category === cat)); });
  }
  var q = $("q").value.trim().toLowerCase();
  var list = items.filter(function (x) { return x.customer; }).concat(items.filter(function (x) { return !x.customer; }));
  return list.filter(function (x) {
    if (cat === CUST) { if (!x.customer) return false; }
    else if (cat && x.category !== cat) return false;
    if (!q) return true;
    return (x.name + " " + x.description + " " + x.author).toLowerCase().indexOf(q) >= 0;
  });
}
function renderChips() {
  var c = $("chips"); c.textContent = "";
  var seen = {}, list = [];
  items.forEach(function (x) { if (!seen[x.category]) { seen[x.category] = 1; list.push({ slug: x.category, name: x.categoryName || x.category }); } });
  list.sort(function (a, b) { return a.name.localeCompare(b.name); });
  var cust = items.some(function (x) { return x.customer; });
  if (cust) list.unshift({ slug: CUST, name: fmt(S.forCustomer, customerName()), cust: true });
  else if (cat === CUST) cat = "";
  if (list.length < 2) return;
  [{ slug: "", name: S.all }].concat(list).forEach(function (k) {
    var e = el("button", "chip" + (k.cust ? " cust" : "") + (k.slug === cat ? " on" : ""), k.name);
    e.onclick = function () { cat = k.slug; render(); };
    c.appendChild(e);
  });
}
function render() {
  renderChips();
  var l = $("list"); l.textContent = "";
  var v = visible();
  if (!v.length) { l.appendChild(el("div", "empty", items.length ? S.none : S.empty)); }
  if (v.length && !v.some(function (x) { return x.id === sel; })) sel = v[0].id;
  v.forEach(function (x) {
    var c = el("div", "card" + (x.id === sel ? " sel" : ""));
    c.appendChild(tile(x));
    var b = el("div", "cbody"), n = el("div", "cname");
    n.appendChild(el("span", "", x.name)); var p = pill(x); if (p) n.appendChild(p);
    var cp = custPill(x); if (cp) n.appendChild(cp);
    b.appendChild(n); b.appendChild(el("div", "cdesc", x.description));
    if (need && need.reasons[x.id]) b.appendChild(el("div", "reason", need.reasons[x.id]));
    var cs = stars(x.rating, x.ratingCount); if (cs) { var cw = el("div", "cstars"); cw.appendChild(cs); b.appendChild(cw); }
    c.appendChild(b);
    actionButtons(x, true).forEach(function (a) { c.appendChild(a); });
    c.onclick = function () { sel = x.id; render(); };
    if (x.id === sel) c.id = "selcard";
    l.appendChild(c);
  });
  renderDetail();
}
function renderDetail() {
  var d = $("detail"); d.textContent = "";
  var x = items.filter(function (i) { return i.id === sel; })[0];
  if (!x) return;
  var h = el("div", "dhead"); h.appendChild(tile(x, true));
  var t = el("div"); t.appendChild(el("div", "dname", x.name));
  var dcp = custPill(x); if (dcp) { var dcw = el("div"); dcw.style.marginTop = "3px"; dcw.appendChild(dcp); t.appendChild(dcw); }
  t.appendChild(el("div", "dmeta", [x.categoryName || x.category, fmt(S.version, x.version), Math.max(1, Math.round(x.size / 1024)) + " KB"].concat(x.installed && x.installed !== x.version ? [S.colInstalled + ": " + x.installed] : []).join("  ·  ")));
  var ds = stars(x.rating, x.ratingCount); if (ds) { var dw = el("div", "cstars"); dw.appendChild(ds); t.appendChild(dw); }
  h.appendChild(t); d.appendChild(h);
  d.appendChild(el("div", "ddesc", x.description));
  if (x.shots > 0 && !shotsAsked[x.id]) { shotsAsked[x.id] = true; post({ cmd: "shots", id: x.id }); }
  if (shots[x.id] && shots[x.id].length) {
    var strip = el("div", "shots");
    shots[x.id].forEach(function (sh) {
      var b = el("button"); var im = el("img"); im.src = sh.src; im.alt = sh.caption || ""; b.appendChild(im);
      if (sh.caption) b.appendChild(el("span", "", sh.caption));
      b.title = S.screenshots || ""; b.onclick = function () { showShot(sh); };
      strip.appendChild(b);
    });
    d.appendChild(strip);
  }
  if (x.changelog) { var n = el("div", "news"); n.appendChild(el("b", "", fmt(S.whatsNew, x.version))); n.appendChild(document.createTextNode(x.changelog)); d.appendChild(n); }
  if (x.author || x.contact) {
    var w = el("div", "who");
    if (x.author) w.appendChild(el("span", "", S.author + ": " + x.author));
    if (x.contact) { var a = el("a", "link", x.contact); a.onclick = function () { post({ cmd: "mail", to: x.contact }); }; w.appendChild(a); }
    d.appendChild(w);
  }
  var acts = el("div", "acts"); actionButtons(x, false).forEach(function (a) { acts.appendChild(a); });
  var rep = el("button", "btn sec", S.report); rep.onclick = function () { reportForm(x); }; acts.appendChild(rep);
  d.appendChild(acts);
  var rate = el("div", "rate");
  if (x.installed) {
    rate.appendChild(el("span", "", S.yourRating));
    var st = el("span", "st");
    for (var k = 1; k <= 5; k++) (function (n) {
      var sb = el("button", n <= (x.mine || 0) ? "on" : "", "\u2605");
      sb.title = n + " / 5"; sb.setAttribute("aria-label", n + " / 5");
      sb.onclick = function () { post({ cmd: "rate", id: x.id, stars: String(n) }); };
      st.appendChild(sb);
    })(k);
    rate.appendChild(st);
    if (x.justRated) rate.appendChild(el("span", "", S.rated));
  } else {
    rate.appendChild(el("span", "", S.rateHint));
  }
  d.appendChild(rate);
  var hint = el("div", "hint");
  hint.innerHTML = '<svg class="i" viewBox="0 0 24 24"><path d="M12 3 5 6v6c0 4 3 7 7 9 4-2 7-5 7-9V6l-7-3z"/></svg>';
  hint.appendChild(el("span", "", S.adminNote)); d.appendChild(hint);
}
function modal(title, text, buttons) {
  code.open = false;
  var m = $("modal"); m.textContent = "";
  if (title) m.appendChild(el("h3", "", title));
  if (text) m.appendChild(el("p", "", text));
  var a = el("div", "acts");
  buttons.forEach(function (b) { var e = el("button", "btn" + (b.sec ? " sec" : ""), b.label); e.onclick = function () { closeModal(); if (b.fn) b.fn(); }; a.appendChild(e); });
  if (buttons.length) m.appendChild(a);
  $("veil").classList.add("on");
  var first = a.querySelector("button"); if (first) first.focus();
}
function codeButton() {
  var b = $("codeBtn"); b.textContent = "";
  if (code.has) b.appendChild(el("span", "ok", "✓"));
  b.appendChild(document.createTextNode(S.codeBtn || ""));
  b.title = code.has && customerName() ? fmt(S.codeActive, customerName()) : (S.codeIntro || "");
}
function codeDialog(message, ok) {
  var m = $("modal"); m.textContent = ""; m.classList.remove("wide");
  var f = el("div", "form");
  f.appendChild(el("h3", "", S.codeBtn));
  if (code.has && customerName()) f.appendChild(el("p", "", fmt(S.codeActive, customerName())));
  var input = null;
  if (code.locked) f.appendChild(el("p", "", S.codeLocked));
  else {
    f.appendChild(el("p", "", S.codeIntro));
    input = el("input"); input.type = "text"; input.maxLength = 64; input.autocomplete = "off"; input.spellcheck = false;
    input.placeholder = "XXXX-XXXX-XXXX-XXXX-XXXX";
    input.onkeydown = function (e) { if (e.key === "Enter") apply(); };
    f.appendChild(input);
  }
  var msg = el("div", "codemsg" + (message ? (ok ? " ok" : " bad") : ""), message || ""); msg.id = "codemsg";
  f.appendChild(msg);
  var a = el("div", "acts");
  function apply() {
    var v = input.value.trim();
    if (!v) { input.focus(); return; }
    msg.className = "codemsg"; msg.textContent = "…";
    post({ cmd: "codeCheck", code: v });
  }
  if (!code.locked) {
    if (code.has) { var r = el("button", "btn sec", S.codeRemove); r.onclick = function () { post({ cmd: "codeRemove" }); }; a.appendChild(r); }
    var ap = el("button", "btn", S.codeApply); ap.onclick = apply; a.appendChild(ap);
  }
  var c = el("button", "btn sec", S.close); c.onclick = function () { code.open = false; closeModal(); }; a.appendChild(c);
  f.appendChild(a); m.appendChild(f);
  code.open = true;
  $("veil").classList.add("on");
  (input || c).focus();
}
function closeModal() { code.open = false; $("veil").classList.remove("on"); $("modal").classList.remove("wide"); }
function showShot(sh) {
  var m = $("modal"); m.textContent = ""; m.classList.add("wide");
  var im = el("img"); im.src = sh.src; im.alt = sh.caption || ""; m.appendChild(im);
  if (sh.caption) { var p = el("p", "", sh.caption); p.style.marginTop = "8px"; m.appendChild(p); }
  var a = el("div", "acts"), c = el("button", "btn sec", S.close); c.onclick = closeModal; a.appendChild(c); m.appendChild(a);
  $("veil").classList.add("on"); c.focus();
}
function reportForm(x) {
  if (busy) return;
  var m = $("modal"); m.textContent = ""; m.classList.remove("wide");
  m.appendChild(el("h3", "", S.report + ": " + x.name));
  var f = el("div", "form");
  var kinds = el("div", "kinds");
  [["problem", S.reportProblem], ["comment", S.reportComment]].forEach(function (k, i) {
    var l = el("label"), r = el("input"); r.type = "radio"; r.name = "kind"; r.value = k[0]; r.checked = i === 0;
    l.appendChild(r); l.appendChild(document.createTextNode(k[1])); kinds.appendChild(l);
  });
  kinds.setAttribute("role", "radiogroup"); kinds.setAttribute("aria-label", S.report);
  f.appendChild(kinds);
  var lt = el("label", "", S.reportText); var ta = el("textarea"); ta.maxLength = 4000; ta.id = "rtext"; lt.htmlFor = "rtext"; f.appendChild(lt); f.appendChild(ta);
  var le = el("label", "", S.reportEmail); var em = el("input"); em.type = "email"; em.maxLength = 200; em.id = "remail"; le.htmlFor = "remail"; f.appendChild(le); f.appendChild(em);
  var lc = el("label", "chk"), cb = el("input"); cb.type = "checkbox"; lc.appendChild(cb); lc.appendChild(document.createTextNode(S.reportLog)); f.appendChild(lc);
  f.appendChild(el("div", "note", S.reportPrivacy));
  m.appendChild(f);
  var a = el("div", "acts");
  var cancel = el("button", "btn sec", S.cancel); cancel.onclick = closeModal;
  var send = el("button", "btn", S.send);
  send.onclick = function () {
    var text = ta.value.trim();
    if (text.length < 5) { ta.focus(); return; }
    var kind = f.querySelector("input[name=kind]:checked").value;
    busyModal(S.send);
    post({ cmd: "feedback", id: x.id, kind: kind, message: text, email: em.value.trim(), log: cb.checked ? "1" : "0" });
  };
  a.appendChild(cancel); a.appendChild(send); m.appendChild(a);
  $("veil").classList.add("on"); ta.focus();
}
function busyModal(text) { var m = $("modal"); m.textContent = ""; m.appendChild(el("div", "spin")); var p = el("p", "", text); p.style.textAlign = "center"; m.appendChild(p); $("veil").classList.add("on"); }
function confirmAct(action, x) {
  if (busy) return;
  var text = action === "install" ? fmt(S.confirmInstall, x.name, x.version) : fmt(S.confirmUninstall, x.name);
  modal(x.name, text, [
    { label: S.cancel, sec: true },
    { label: action === "install" ? (status(x) === "upd" ? S.update : S.install) : S.remove, fn: function () {
      busy = true; render(); busyModal(action === "install" ? S.installing : S.removing);
      post({ cmd: action, id: x.id });
    } }
  ]);
}
function onResult(m) {
  busy = false; closeModal(); render();
  if (m.ok && m.restart) {
    modal(m.title || "", m.message, [{ label: S.later, sec: true }, { label: S.restartNow, fn: function () { post({ cmd: "restart" }); } }]);
  } else if (m.message) {
    modal(m.title || "", m.message, [{ label: S.close }]);
  }
}
function apply(m) {
  if (m.type === "init") {
    S = m.strings || {};
    $("title").textContent = S.title; document.title = S.title;
    $("q").placeholder = S.search; $("q").title = S.needHint || "";
    $("q").setAttribute("aria-label", S.search);
    $("needAll").textContent = S.needAll || "";
    $("needAll").onclick = clearNeed;
    $("disc").textContent = S.disclaimer; $("disc").title = S.disclaimer;
    $("discLink").textContent = S.disclaimerBtn;
    $("discLink").onclick = function () { modal(S.disclaimerBtn, S.disclaimerFull, [{ label: S.close }]); };
    $("updBtn").textContent = S.selfUpdateBtn;
    $("updBtn").onclick = function () { busyModal(S.selfUpdateBtn); post({ cmd: "selfUpdate" }); };
    locked = !!m.installLocked;
    if (m.code) { code.has = !!m.code.has; code.locked = !!m.code.locked; }
    $("codeBtn").onclick = function () { codeDialog(); };
    codeButton();
    $("lock").style.display = locked ? "flex" : "none"; $("lock").textContent = S.installLocked || "";
  } else if (m.type === "catalog") {
    items = m.items || []; self = m.self || null;
    codeButton();
    $("err").style.display = m.error ? "flex" : "none"; $("err").textContent = m.error || "";
    $("upd").style.display = self ? "flex" : "none";
    if (self) $("updText").textContent = fmt(S.selfUpdate, self.version, self.installed);
    if (m.select) { sel = m.select; cat = ""; }
    render();
    var sc = $("selcard"); if (sc && m.select) sc.scrollIntoView({ block: "center" });
    if (m.select) {
      var x = items.filter(function (i) { return i.id === m.select; })[0];
      if (x && status(x) !== "inst" && !locked) confirmAct("install", x);
      else if (!x && m.selectMissing) modal("", m.selectMissing, [{ label: S.close }]);
    }
  } else if (m.type === "rated") {
    items.forEach(function (x) { if (x.id === m.id) { x.rating = m.rating; x.ratingCount = m.ratingCount; x.mine = m.mine; x.justRated = true; } });
    render();
  } else if (m.type === "need") {
    if (m.q !== $("q").value.trim()) return;   // the user typed on meanwhile
    var reasons = {}, order = [];
    (m.hits || []).forEach(function (h) { order.push(h.id); reasons[h.id] = h.reason || ""; });
    need = { q: m.q, order: order, reasons: reasons };
    $("need").style.display = "flex";
    $("needText").textContent = order.length ? fmt(S.needHits, m.q) : fmt(S.needNone, m.q);
    if (order.length) sel = order[0];
    render();
  } else if (m.type === "shots") {
    shots[m.id] = m.items || []; render();
  } else if (m.type === "icon") {
    icons[m.id] = m.data; render();
  } else if (m.type === "code") {
    if (m.ok) { code.has = !!m.has; code.customer = m.customer || ""; if (!m.has) { code.customer = ""; if (cat === CUST) cat = ""; } }
    codeButton();
    if (code.open) codeDialog(m.message, m.ok);
    else if (m.message) modal(S.codeBtn, m.message, [{ label: S.close }]);
  } else if (m.type === "result") {
    onResult(m);
  } else if (m.type === "message") {
    // an install or removal in progress keeps its progress dialog; only its
    // own "result" ends it (a late rating/feedback reply must not)
    if (busy) return;
    closeModal(); render();
    if (m.message) modal(m.title || "", m.message, [{ label: S.close }]);
  }
}
function clearNeed() { need = null; $("need").style.display = "none"; render(); }
if (host) host.addEventListener("message", function (e) { apply(e.data); });
$("q").addEventListener("input", function () { if (need) { need = null; $("need").style.display = "none"; } render(); });
$("q").addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    var q = $("q").value.trim();
    if (q.length >= 2) { post({ cmd: "need", q: q }); $("needText").textContent = "\u2026"; $("need").style.display = "flex"; }
    e.preventDefault();
  }
  if (e.key === "Escape" && need) { clearNeed(); e.stopPropagation(); }
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && $("veil").classList.contains("on") && !busy) { closeModal(); return; }
  if ($("veil").classList.contains("on")) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    var v = visible(), i = v.findIndex(function (x) { return x.id === sel; });
    i = Math.max(0, Math.min(v.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)));
    if (v[i]) { sel = v[i].id; render(); var sc = $("selcard"); if (sc) sc.scrollIntoView({ block: "nearest" }); }
    e.preventDefault();
  }
  if ((e.ctrlKey && e.key === "f") || e.key === "F3") { $("q").focus(); e.preventDefault(); }
  if (e.key === "F5") { post({ cmd: "refresh" }); e.preventDefault(); }
});
document.addEventListener("contextmenu", function (e) { if (e.target.tagName !== "INPUT") e.preventDefault(); });
post({ cmd: "ready" });
</script>
