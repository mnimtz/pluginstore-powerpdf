<!-- Tungsten Plug-in UI 1.1.0 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; font-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Add-on Store</title>
<style>
/*tpui:begin*/
/* Tungsten Plug-in UI (tpui) 1.1.0 - the shared look of our Power PDF plug-ins.
   The look of Smart Compare and the Add-on Store, aligned with the Tungsten Automation
   Brand Book November 2026 (1.1.0: white header with the 2026 logo, calmer lines, medium
   weight buttons; colours of the 2026 template, unchanged). Pages use the variables and
   building blocks below and write no colour values of their own (tools/check_ui.py checks it).
   MIT License, see LICENSE. */
:root {
  /* brand palette (theme "Tungsten Automation 2026" of the official template) */
  --tp-navy: #002854;          /* primary, headings, primary buttons, header */
  --tp-navy-deep: #003A6D;     /* hover and pressed of navy surfaces (navy 85 % + blue) */
  --tp-blue: #00A0FB;          /* accent: focus, active markers, icon accents, progress; never text on white (2.8:1) */
  --tp-blue-light: #9DDDF9;
  --tp-green: #00EB86;         /* start of the PDF & eSignature gradient */
  --tp-ink: #231F20;           /* body text */
  --tp-gray-50: #FAFAFA;       /* page background */
  --tp-gray-100: #F0F0F0;      /* surfaces */
  --tp-gray-200: #E0E5EA;      /* lines, borders (navy 12 % + white) */
  --tp-gray-blue: #D9DFE6;     /* blue tinted surface, input borders */
  --tp-slate: #8094AA;         /* decoration and disabled only (3.1:1) */
  --tp-yellow: #FFC600;
  --tp-coral: #FF6D69;
  --tp-magenta: #D030E8;
  /* text shades derived from the palette for readable text (WCAG, at least 4.5:1 on white) */
  --tp-text-muted: #5B6B80;    /* from slate, 5.4:1 */
  --tp-link: #006FB5;          /* from the accent blue, 5.3:1 */
  --tp-ok: #016839;            /* brand dark green, 6.9:1 */
  --tp-ok-bg: #B6FFDE;
  --tp-warn: #7A5A00;          /* from yellow, 6.4:1 */
  --tp-warn-bg: #FFF4CC;
  --tp-err: #B3261E;           /* from coral, 6.5:1 */
  --tp-err-bg: #FFE1E0;
  --tp-white: #FFFFFF;         /* surfaces and text on navy */
  --tp-info-bg: #E8F6FE;
  --tp-sel-bg: #E8F6FE;
  /* gradients */
  --tp-accent-pdf: linear-gradient(90deg, #00EB86 0%, #00A0FB 100%);
  --tp-domain-blue: #002854;   /* 1.1.0: navy surfaces are plain navy */
  /* type (Brand Book p. 20, 22; sizes are ours: a plug-in window is denser than a page) */
  --tp-font: "Red Hat Display", Arial, sans-serif;
  --tp-fs-h1: 17px;   /* window title in the header */
  --tp-fs-h2: 16px;   /* page heading */
  --tp-fs-h3: 14px;   /* card heading, form header */
  --tp-fs-h4: 13px;   /* sub heading, large button */
  --tp-fs-body: 13px; /* text, labels, buttons */
  --tp-fs-small: 11.5px; /* captions, footnotes, meta */
  --tp-lh: 1.5;
  /* shape */
  --tp-radius: 8px;
  --tp-radius-card: 6px;      /* 1.1.0: flatter tiles */
  --tp-radius-btn: 4px;
  --tp-radius-pill: 999px;
  --tp-shadow-pop: 0 8px 28px rgba(0, 30, 60, .18);
  --tp-shadow-dialog: 0 12px 40px rgba(0, 0, 0, .25);
  --tp-shadow-page: 0 1px 4px rgba(0, 30, 60, .25);   /* a document page on the grey viewer */
  --tp-veil: rgba(0, 40, 84, .28);
  --tp-gap: 14px;
  /* compatibility: pages built before the kit keep working and get the brand colours */
  --navy: var(--tp-navy); --navy2: var(--tp-navy-deep); --blue: var(--tp-blue); --green: var(--tp-green);
  --ink: var(--tp-ink); --slate: var(--tp-text-muted); --line: var(--tp-gray-200); --soft: var(--tp-gray-100);
  --sel: var(--tp-sel-bg); --good: var(--tp-ok); --bad: var(--tp-err); --red: var(--tp-err); --amber: var(--tp-warn);
}
/* scripts without Latin letters: Red Hat Display has no glyphs there, the Windows UI font takes over */
:lang(zh-Hans), :lang(zh-CN) { --tp-font: "Microsoft YaHei UI", "Microsoft YaHei", Arial, sans-serif; }
:lang(zh-Hant), :lang(zh-TW) { --tp-font: "Microsoft JhengHei UI", "Microsoft JhengHei", Arial, sans-serif; }
:lang(ja) { --tp-font: "Yu Gothic UI", "Meiryo UI", Arial, sans-serif; }
:lang(ko) { --tp-font: "Malgun Gothic", Arial, sans-serif; }
:lang(ar) { --tp-font: "Segoe UI", Tahoma, Arial, sans-serif; }

/* ---- base ---- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--tp-font); font-size: var(--tp-fs-body); line-height: var(--tp-lh); color: var(--tp-ink); background: #fff; }
body.tp-fixed { overflow: hidden; user-select: none; }
button, select, input, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4, h5, h6 { color: var(--tp-navy); margin: 0 0 6px; line-height: 1.3; }
/* 1.1.0: headings lighter as in the Brand Book; at window sizes in navy (the primary blue would be too
   faint below 24px) */
h1 { font-size: var(--tp-fs-h1); font-weight: 400; }
h2 { font-size: var(--tp-fs-h2); font-weight: 400; }
h3 { font-size: var(--tp-fs-h3); font-weight: 600; }
h4 { font-size: var(--tp-fs-h4); font-weight: 600; }
/* large display heading (a product or add-on name): light weight */
.tp-display { font-size: 22px; font-weight: 300; line-height: 1.2; color: var(--tp-navy); }
h5 { font-size: var(--tp-fs-body); font-weight: 400; }
h6 { font-size: var(--tp-fs-small); font-weight: 400; color: var(--tp-text-muted); }
p { margin: 0 0 10px; }
a, .link { color: var(--tp-link); text-decoration: none; cursor: pointer; font-weight: 500; }
a:hover, .link:hover { text-decoration: underline; }
button.link { all: unset; color: var(--tp-link); cursor: pointer; font-weight: 500; }
code, kbd { font-family: Consolas, "Cascadia Mono", monospace; font-size: .92em; background: var(--tp-gray-100); border-radius: 4px; padding: 0 4px; }
.sub, small { font-size: var(--tp-fs-small); color: var(--tp-text-muted); }
.lead { color: var(--tp-text-muted); margin: 0 0 16px; }
.muted { color: var(--tp-text-muted); }
:focus-visible { outline: 2px solid var(--tp-blue); outline-offset: 1px; }
::selection { background: var(--tp-blue-light); }
.grow { flex: 1; }
.hidden { display: none !important; }

/* ---- frame: header, optional side navigation ---- */
/* 1.1.0: a white header with a line below and the 2026 logo in navy (web/brand, Brand Book p. 13):
   <header class="tp-head"><img class="tp-logo" src=".../brand/tungsten-automation-logo-2026-blue.svg" alt="Tungsten Automation">
   <span class="tp-sep"></span><span class="t">...</span><span class="s">...</span>...</header> */
.tp-app { display: flex; flex-direction: column; height: 100%; }
.tp-head { background: #fff; color: var(--tp-navy); padding: 10px 18px; display: flex; align-items: center; gap: 10px; flex: none; border-bottom: 1px solid var(--tp-gray-200); }
.tp-head .tp-logo { height: 22px; width: auto; display: block; flex: none; }
.tp-head .tp-sep { width: 1px; height: 22px; background: var(--tp-gray-200); flex: none; margin: 0 4px; }
.tp-head .t { font-size: var(--tp-fs-h1); font-weight: 400; }
.tp-head .s { font-size: var(--tp-fs-small); color: var(--tp-text-muted); }
.tp-head .btn.ghost { color: var(--tp-navy); }
.tp-head .btn.ghost:hover { background: var(--tp-gray-100); }
/* the gradient line under the header is gone (1.1.0); the class stays so older pages keep their layout */
.tp-accent { display: none; }
.tp-body { flex: 1; display: flex; min-height: 0; }
.tp-side { width: 210px; flex: none; border-inline-end: 1px solid var(--tp-gray-200); background: var(--tp-gray-50); padding: 12px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.tp-side button { all: unset; cursor: pointer; padding: 8px 12px; border-radius: var(--tp-radius); color: var(--tp-navy); display: flex; align-items: center; gap: 8px; }
.tp-side button:hover { background: var(--tp-gray-100); }
.tp-side button.on { background: var(--tp-navy); color: #fff; font-weight: 700; }
.tp-side button:focus-visible { outline: 2px solid var(--tp-blue); }
.tp-side .head { font-size: var(--tp-fs-small); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--tp-text-muted); margin: 12px 12px 4px; }
.tp-main { flex: 1; overflow: auto; min-width: 0; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 20px 26px 30px; }
.tp-foot { position: sticky; bottom: 0; background: linear-gradient(transparent, #fff 30%); padding: 14px 0 4px; display: flex; justify-content: flex-end; gap: 10px; align-items: center; }

/* ---- cards ---- */
.card { border: 1px solid var(--tp-gray-200); border-radius: var(--tp-radius-card); padding: 14px 16px; margin-bottom: var(--tp-gap); background: #fff; }
.card > h3 { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.card.soft { background: var(--tp-gray-50); }

/* ---- buttons (sentence case, medium weight; Brand Book p. 20) ---- */
.btn { border: 0; border-radius: var(--tp-radius-btn); padding: 8px 16px; font-size: var(--tp-fs-body); font-weight: 500; background: var(--tp-navy); color: #fff; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.btn:hover { background: var(--tp-navy-deep); }
.btn.sec { background: #fff; color: var(--tp-navy); border: 1px solid var(--tp-gray-blue); }
.btn.sec:hover { background: var(--tp-gray-100); }
.btn.ghost { background: transparent; color: var(--tp-navy); padding: 5px 8px; }
.btn.ghost:hover { background: var(--tp-gray-100); }
.btn.danger { background: var(--tp-err); }
.btn.danger:hover { background: #8E1E18; }
.btn.sm { padding: 5px 11px; font-size: var(--tp-fs-small); }
.btn.big { padding: 10px 26px; font-size: 14px; }
.btn:disabled, .btn[aria-disabled=true] { opacity: .5; cursor: default; }
.acts { display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }

/* ---- forms ---- */
label.field { display: flex; flex-direction: column; gap: 4px; color: var(--tp-navy); margin-bottom: 10px; }
label.field > small { color: var(--tp-text-muted); }
select, input[type=text], input[type=search], input[type=email], input[type=url], input[type=password], input[type=number], textarea {
  border: 1px solid var(--tp-gray-blue); border-radius: var(--tp-radius); padding: 7px 10px; background: #fff; color: var(--tp-ink); user-select: text; min-width: 0; }
select:focus, input:focus, textarea:focus { outline: 2px solid var(--tp-blue); outline-offset: -1px; border-color: var(--tp-blue); }
input:disabled, select:disabled, textarea:disabled { background: var(--tp-gray-100); color: var(--tp-text-muted); }
input[type=checkbox], input[type=radio] { accent-color: var(--tp-navy); width: 16px; height: 16px; }
.field-err { color: var(--tp-err); font-size: var(--tp-fs-small); }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.row > label { color: var(--tp-text-muted); min-width: 120px; }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 5px 0; }
.switch input { appearance: none; width: 36px; height: 20px; border-radius: var(--tp-radius-pill); background: var(--tp-gray-blue); position: relative; cursor: pointer; flex: none; margin: 0; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 2px; inset-inline-start: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: inset-inline-start .15s; }
.switch input:checked { background: var(--tp-navy); }
.switch input:checked::after { inset-inline-start: 18px; }
.switch .lb { display: flex; flex-direction: column; }
.switch .lb small { font-size: var(--tp-fs-small); }
.seg { display: inline-flex; border: 1px solid var(--tp-gray-blue); border-radius: 9px; overflow: hidden; background: #fff; }
.seg button { all: unset; cursor: pointer; padding: 7px 14px; color: var(--tp-navy); border-inline-end: 1px solid var(--tp-gray-200); display: inline-flex; align-items: center; gap: 6px; }
.seg button:last-child { border-inline-end: 0; }
.seg button:hover { background: var(--tp-gray-100); }
.seg button.on { background: var(--tp-navy); color: #fff; font-weight: 700; }
.seg button:focus-visible { outline: 2px solid var(--tp-blue); outline-offset: -2px; }
.seg.sm button { padding: 4px 10px; font-size: var(--tp-fs-small); }

/* ---- lists, chips, badges ---- */
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { all: unset; cursor: pointer; font-size: var(--tp-fs-small); padding: 3px 10px; border-radius: var(--tp-radius-pill); border: 1px solid var(--tp-gray-200); background: #fff; color: var(--tp-text-muted); display: inline-flex; gap: 5px; align-items: center; }
.chip.on { background: var(--tp-navy); color: #fff; border-color: transparent; }
.chip:focus-visible { outline: 2px solid var(--tp-blue); }
.badge, .pill { font-size: 10.5px; font-weight: 700; padding: 1px 8px; border-radius: var(--tp-radius-pill); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; background: var(--tp-gray-100); color: var(--tp-navy); }
.badge.ok { background: var(--tp-ok-bg); color: var(--tp-ok); }
.badge.warn { background: var(--tp-warn-bg); color: var(--tp-warn); }
.badge.err { background: var(--tp-err-bg); color: var(--tp-err); }
.badge.info { background: var(--tp-info-bg); color: var(--tp-navy); }
.badge.accent { background: var(--tp-navy); color: #fff; }
.tp-list { display: flex; flex-direction: column; gap: 6px; }
.item { border: 1px solid var(--tp-gray-200); border-radius: 9px; background: #fff; padding: 8px 10px; cursor: pointer; border-inline-start: 4px solid var(--tp-gray-200); }
.item:hover { border-color: var(--tp-gray-blue); }
.item.sel { background: var(--tp-sel-bg); border-color: var(--tp-blue); box-shadow: 0 0 0 1px var(--tp-blue); }
.item .h { display: flex; align-items: center; gap: 6px; font-size: var(--tp-fs-small); color: var(--tp-text-muted); }
.item .h b { color: var(--tp-navy); }
.item.ok { border-inline-start-color: var(--tp-ok); } .item.warn { border-inline-start-color: var(--tp-yellow); } .item.err { border-inline-start-color: var(--tp-coral); }
.pager { display: flex; align-items: center; gap: 6px; padding: 8px 2px; font-size: var(--tp-fs-small); color: var(--tp-text-muted); }
.pager select { padding: 3px 6px; font-size: var(--tp-fs-small); }
table.tp-table { width: 100%; border-collapse: collapse; }
.tp-table th { text-align: start; font-weight: 700; color: var(--tp-navy); background: var(--tp-gray-100); padding: 7px 10px; border-bottom: 1px solid var(--tp-gray-200); }
.tp-table td { padding: 7px 10px; border-bottom: 1px solid var(--tp-gray-200); vertical-align: top; }
.tp-table tr:hover td { background: var(--tp-gray-50); }

/* ---- messages ---- */
.banner { padding: 8px 14px; display: flex; align-items: center; gap: 10px; border-radius: var(--tp-radius); margin-bottom: 10px; }
.banner.info { background: var(--tp-info-bg); color: var(--tp-navy); }
.banner.ok { background: var(--tp-ok-bg); color: var(--tp-ok); }
.banner.warn { background: var(--tp-warn-bg); color: var(--tp-warn); }
.banner.err { background: var(--tp-err-bg); color: var(--tp-err); }
.banner.full { border-radius: 0; margin: 0; }
.banner .x { all: unset; cursor: pointer; padding: 0 4px; font-size: 15px; line-height: 1; }
.note { padding: 8px 12px; border-radius: var(--tp-radius); background: var(--tp-info-bg); color: var(--tp-navy); }
.empty { padding: 22px 12px; color: var(--tp-text-muted); text-align: center; border: 1px dashed var(--tp-gray-200); border-radius: var(--tp-radius-card); }
.tp-toasts { position: fixed; inset-inline-end: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 80; }
.tp-toast { background: var(--tp-navy); color: #fff; padding: 9px 14px; border-radius: var(--tp-radius); box-shadow: var(--tp-shadow-pop); max-width: 360px; }
.tp-toast.ok { background: var(--tp-ok); } .tp-toast.err { background: var(--tp-err); }

/* ---- dialogs in the page (never browser pop-ups) ---- */
.tp-veil { position: fixed; inset: 0; background: var(--tp-veil); display: flex; align-items: center; justify-content: center; z-index: 60; }
.tp-dialog { background: #fff; border-radius: 12px; padding: 20px 22px 16px; width: 420px; max-width: calc(100vw - 32px); box-shadow: var(--tp-shadow-dialog); }
.tp-dialog h3 { margin-bottom: 8px; }
.tp-dialog p { color: var(--tp-ink); white-space: pre-line; }
.tp-dialog .acts { margin-top: 14px; }
.tp-dialog input { width: 100%; }

/* ---- progress ---- */
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--tp-gray-blue); border-top-color: var(--tp-blue); animation: tp-r .9s linear infinite; flex: none; display: inline-block; }
@keyframes tp-r { to { transform: rotate(360deg); } }
.bar { height: 6px; border-radius: var(--tp-radius-pill); background: var(--tp-gray-100); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--tp-accent-pdf); transition: width .2s; }
.tp-busy .steps { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; }
.tp-busy .steps div { display: flex; align-items: center; gap: 8px; color: var(--tp-text-muted); }
.tp-busy .steps div.on { color: var(--tp-navy); font-weight: 700; }
.tp-busy .steps div.done { color: var(--tp-ok); }
.tp-busy .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--tp-gray-blue); flex: none; }
.tp-busy .done .dot { background: var(--tp-ok); border-color: var(--tp-ok); }
.tp-busy .on .dot { border-color: var(--tp-blue); }

/* ---- menus ---- */
.menu { position: relative; display: inline-block; }
.menu > .pop { position: absolute; top: calc(100% + 4px); inset-inline-start: 0; background: #fff; border: 1px solid var(--tp-gray-200); border-radius: var(--tp-radius-card); box-shadow: var(--tp-shadow-pop); padding: 6px; min-width: 220px; display: none; z-index: 30; }
.menu.end > .pop { inset-inline-start: auto; inset-inline-end: 0; }
.menu.open > .pop { display: block; }
.menu > .pop button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; width: 100%; box-sizing: border-box; color: var(--tp-ink); }
.menu > .pop button:hover, .menu > .pop button:focus-visible { background: var(--tp-gray-100); }
.menu > .pop button small { display: block; }
.menu > .pop hr { border: 0; border-top: 1px solid var(--tp-gray-200); margin: 4px 0; }

/* ---- icons: line icons, base colour plus accent (Brand Book p. 23) ---- */
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
svg.i .ac { stroke: var(--tp-blue); }
svg.i.lg { width: 24px; height: 24px; stroke-width: 1.6; }
/* on navy surfaces the accent turns light so it stays visible */
.btn:not(.sec):not(.ghost) svg.i .ac, .tp-side button.on svg.i .ac, .seg button.on svg.i .ac, .chip.on svg.i .ac { stroke: var(--tp-blue-light); }

/* ---- right to left, motion ---- */
[dir=rtl] .tp-side, [dir=rtl] .tp-main { direction: rtl; }
[dir=rtl] input[type=email], [dir=rtl] input[type=url], [dir=rtl] code { direction: ltr; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
/* dark design: prepared, not built; a later version sets the variables above under [data-theme=dark] */
/*tpui:end*/

</style>
<style>
/* Tungsten Plug-in UI - Red Hat Display, the brand font (Brand Book November 2026, p. 20).
   Optional (1.1.0): a page that links this file next to tpui.css shows the brand font even on computers
   without it; tools/inline.py embeds the four files as data: URIs (about 250 KB), so the page's
   Content-Security-Policy needs "font-src data:". Without this file the kit asks for the font by name and

<style>
/* Store window (C1.9.11): look from the Tungsten Plug-in UI (client/third_party/tpui); only the store's
   own layout stays here, colours only as kit variables. C1.9.18: kit 1.1.0, Brand Book November 2026
   (white header with the 2026 logo, brand font embedded) */
/* tpui:domain-colors */
/* letter tiles of add-ons without an icon: palette shades, white text at least 4.5:1 */
:root{--tile-1:#002854;--tile-2:#016839;--tile-3:#006FB5;--tile-4:#8A1FA0;--tile-5:#004766;--tile-6:#7A5A00}
/* /tpui:domain-colors */
html,body{overflow:hidden;user-select:none}
button{cursor:pointer}
.app{display:flex;flex-direction:column;height:100%}
header.tp-head{padding:12px 18px}
.search{margin-inline-start:auto;display:flex;align-items:center;gap:8px;background:var(--tp-gray-50);border:1px solid var(--tp-gray-blue);border-radius:var(--tp-radius-btn);padding:6px 11px;width:280px}
.search:focus-within{border-color:var(--tp-blue);outline:2px solid var(--tp-blue);outline-offset:-1px;background:var(--tp-white)}
.search svg.i{color:var(--tp-text-muted)}
.search input{all:unset;font-size:13px;color:var(--tp-ink);width:100%;user-select:text}
.search input::placeholder{color:var(--tp-text-muted)}
.hbtn{background:var(--tp-white);color:var(--tp-navy);border:1px solid var(--tp-gray-blue);border-radius:var(--tp-radius-btn);padding:6px 12px;font-size:12px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:6px}
.hbtn:hover{background:var(--tp-gray-100)}
.hbtn .ok{color:var(--tp-ok);font-weight:700}
.chip.cust{border-color:var(--tp-blue)}
.chip.cust.on{background:var(--tp-navy);border-color:var(--tp-blue)}
.codemsg{font-size:12.5px;margin-top:10px;line-height:1.5}
.codemsg.ok{color:var(--tp-ok)}.codemsg.bad{color:var(--tp-err)}
.modal.mid{width:min(620px,92vw)}
.codehead{font-size:12px;font-weight:700;color:var(--tp-text-muted);margin:10px 0 6px}
.codelist{border:1px solid var(--tp-gray-200);border-radius:8px;margin-bottom:10px}
.coderow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px;border-top:1px solid var(--tp-gray-200)}
.coderow:first-child{border-top:0}.coderow.muted{color:var(--tp-text-muted);font-size:12.5px}
.codewho{min-width:0;overflow-wrap:anywhere}.codewho b{color:var(--tp-navy);margin-inline-end:8px}
.codeval{font-family:Consolas,monospace;font-size:12px;color:var(--tp-text-muted);margin-inline-end:8px}
.codeaddons{font-size:12px;color:var(--tp-ink);margin-top:2px}
/* banners run across the window (the kit's are boxes) */
.banner{font-size:12.5px;padding:8px 18px;border-radius:0;margin:0;flex:none}
.banner.upd{background:var(--tp-warn-bg);color:var(--tp-warn)}
.banner.need{background:var(--tp-info-bg);color:var(--tp-navy)}
.chips{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;padding:12px 18px 6px;flex:none}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.apick{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--tp-navy)}
.apick[hidden]{display:none}
.apick select{width:auto;min-width:150px;max-width:220px;font-size:12px;padding:4px 10px;border-radius:999px}
/* the kit's chips are unset links; here they are buttons */
.chip{cursor:pointer;display:inline-flex;align-items:center;font-size:12px;padding:4px 12px;border-radius:999px;border:1px solid var(--tp-gray-blue);background:var(--tp-white);color:var(--tp-navy)}
.chip.on{background:var(--tp-navy);color:var(--tp-white);border-color:var(--tp-navy)}
.main{flex:1;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);min-height:0}
.list{overflow-y:auto;padding:4px 10px 14px;border-inline-end:1px solid var(--tp-gray-200)}
[dir=rtl] .cname span,[dir=rtl] .dname,[dir=rtl] .cdesc,[dir=rtl] .ddesc,[dir=rtl] .dmeta,[dir=rtl] .news-name{unicode-bidi:plaintext;text-align:start}
/* list rows of the catalog (the kit's .card is a framed box) */
.card{display:flex;gap:12px;padding:10px 12px;border-radius:10px;border:1px solid transparent;align-items:center;margin-bottom:2px;background:transparent}
.card:hover{background:var(--tp-gray-100)}
.card.sel{background:var(--tp-sel-bg);border-color:var(--tp-blue)}
.tile{width:42px;height:42px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--tp-white);font-weight:700;font-size:15px;overflow:hidden;background:var(--tp-navy)}
.tile img{width:100%;height:100%;object-fit:contain;background:var(--tp-white)}
.tile.big{width:64px;height:64px;border-radius:14px;font-size:22px}
.cbody{min-width:0;flex:1}
.cname{display:flex;gap:8px;align-items:center;min-width:0}
.cname span:first-child{font-size:14px;font-weight:600;color:var(--tp-navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdesc{font-size:12px;color:var(--tp-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pill{font-size:11px;font-weight:400;padding:2px 8px;flex:none}
.p-inst{background:var(--tp-ok-bg);color:var(--tp-ok)}.p-upd{background:var(--tp-warn-bg);color:var(--tp-warn)}.p-beta{background:var(--tp-gray-blue);color:var(--tp-navy)}
.p-cust{background:var(--tp-info-bg);color:var(--tp-navy);max-width:180px;overflow:hidden;text-overflow:ellipsis}
.reason{font-size:12px;color:var(--tp-navy);margin-top:2px;white-space:normal}
.btn.sm{padding:5px 12px;font-size:12px}
.split{display:inline-flex;flex:none}
.split>.btn:first-child{border-start-end-radius:0;border-end-end-radius:0}
.split>.caret{border-start-start-radius:0;border-end-start-radius:0;padding-inline:7px;margin-inline-start:1px}
.split>.pop{min-width:170px}
.btn:disabled{opacity:.55}
.detail{overflow-y:auto;padding:18px 20px}
.dhead{display:flex;gap:14px;align-items:center}
.dname{font-size:22px;font-weight:300;line-height:1.2;color:var(--tp-navy)}
.dmeta{font-size:12px;color:var(--tp-text-muted);margin-top:2px}
.ddesc{font-size:13px;line-height:1.6;margin:14px 0;user-select:text;white-space:pre-wrap}
.dnote{margin-top:12px;padding:8px 12px;border-radius:8px;background:var(--tp-info-bg);color:var(--tp-navy);font-size:12.5px;line-height:1.5}
.news{background:var(--tp-gray-100);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;user-select:text}
.news b{display:block;color:var(--tp-navy);margin-bottom:3px}
.who{display:flex;gap:8px;align-items:center;margin:14px 0 4px;font-size:12px;color:var(--tp-text-muted);flex-wrap:wrap}
/* C1.9.9: "connects to" from the declaration checked in the review */
.conn{margin-top:12px;border:1px solid var(--tp-gray-200);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5}
.conn b.ct{display:block;color:var(--tp-navy);margin-bottom:4px}
.conn .cprov{margin-bottom:6px}
.conn ul{list-style:none;margin:0;padding:0}
.conn li{padding:4px 0;border-top:1px solid var(--tp-gray-200)}
.conn li:first-child{border-top:0}
.conn .cn{font-weight:700;color:var(--tp-navy)}
.conn code{font-size:11.5px;margin-inline-start:6px;overflow-wrap:anywhere}
.conn .cd{display:block;color:var(--tp-text-muted);overflow-wrap:anywhere}
.conn .cnote{margin-top:6px;color:var(--tp-text-muted);font-size:11.5px}
.acts{gap:8px;margin-top:16px;justify-content:flex-start}
.hint{font-size:11.5px;color:var(--tp-text-muted);margin-top:12px;display:flex;gap:6px;align-items:flex-start}
/* the kit's empty state is a dashed box; here it is plain text */
.empty{padding:28px 12px;color:var(--tp-text-muted);font-size:13px;text-align:center;border:0}
.sect{display:flex;gap:8px;align-items:center;font-size:11.5px;font-weight:700;color:var(--tp-text-muted);padding:12px 12px 4px;letter-spacing:.02em}
.sect:first-child{padding-top:6px}
.sect .pill{font-weight:700;letter-spacing:0}
footer{border-top:1px solid var(--tp-gray-200);padding:8px 18px;font-size:11.5px;color:var(--tp-text-muted);display:flex;gap:10px;align-items:center;flex:none}
footer .grow{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.veil{position:fixed;inset:0;background:var(--tp-veil);display:none;align-items:center;justify-content:center;z-index:10}
.veil.on{display:flex}
.modal{background:var(--tp-white);border-radius:12px;padding:20px 22px;width:min(460px,90vw);max-height:80vh;overflow:auto;box-shadow:var(--tp-shadow-dialog)}
.modal h3{margin:0 0 8px;font-size:16px}
.modal p{margin:0 0 6px;line-height:1.55;white-space:pre-wrap;user-select:text}
.modal .acts{justify-content:flex-end}
.spin{display:block;width:30px;height:30px;border-width:3px;margin:0 auto 12px}
.stars{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--tp-text-muted)}
.stars i{font-style:normal;letter-spacing:1px;background:linear-gradient(90deg,var(--tp-yellow) var(--p),var(--tp-gray-blue) var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}
.stars b{color:var(--tp-navy)}
.cstars{margin-top:3px}
.rate{display:flex;align-items:center;gap:10px;margin:14px 0 0;font-size:12px;color:var(--tp-text-muted);flex-wrap:wrap}
.rate .st{display:inline-flex}
.rate button{all:unset;cursor:pointer;font-size:20px;line-height:1;color:var(--tp-gray-blue);padding:0 1px}
.rate button.on{color:var(--tp-yellow)}
.rate button:focus-visible{outline:2px solid var(--tp-blue);border-radius:3px}
.shots{display:flex;gap:10px;overflow-x:auto;margin:14px 0 2px;padding-bottom:6px}
.shots button{all:unset;cursor:zoom-in;flex:none;width:200px;border:1px solid var(--tp-gray-200);border-radius:8px;overflow:hidden;background:var(--tp-white)}
.shots button:hover{border-color:var(--tp-blue)}
.shots img{display:block;width:200px;height:125px;object-fit:cover;background:var(--tp-gray-100)}
.shots span{display:block;font-size:11px;color:var(--tp-text-muted);padding:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal.wide{width:min(1100px,94vw)}
.modal.wide img{display:block;max-width:100%;max-height:70vh;margin:0 auto}
.form label{display:block;font-size:12px;color:var(--tp-text-muted);margin:10px 0 4px}
.form textarea,.form input[type=email],.form input[type=text]{width:100%;padding:8px 10px}
.form textarea{min-height:120px;resize:vertical}
.form .kinds{display:flex;gap:14px;margin-top:4px}
.form .kinds label,.form .chk{display:flex;gap:6px;align-items:center;margin:0;color:var(--tp-ink);font-size:13px}
.form .chk{margin-top:10px}
/* a small hint line in the report form (the kit's .note is a blue box) */
.form .note{font-size:11.5px;color:var(--tp-text-muted);margin-top:10px;line-height:1.5;background:none;padding:0;border-radius:0}
.form .note.bad{color:var(--tp-err)}
.form .att{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.form .attlist{display:flex;gap:6px;flex-wrap:wrap}
.form .attlist .chip{display:inline-flex;align-items:center;gap:4px}
.form .attlist .x{border:0;background:transparent;color:inherit;cursor:pointer;font-size:14px;line-height:1;padding:0 2px}
.news-name{font-weight:700;color:var(--tp-navy);margin:12px 0 4px}
.news-text{white-space:pre-wrap;font-size:13px;line-height:1.5;color:var(--tp-ink);max-height:300px;overflow:auto}
/* "Available updates" view (C1.9.0): opened from the Help tab and the one-time notice */
.upview{flex:1;overflow:auto;padding:16px 20px;flex-direction:column;gap:12px;display:none;min-height:0;background:var(--tp-gray-100)}
body.upmode .upview{display:flex}
body.upmode .search,body.upmode #codeBtn,body.upmode #chips,body.upmode .main,body.upmode #ppu,body.upmode #upd{display:none!important}
#storeBtn{display:none}
body.upmode #storeBtn{display:flex;margin-inline-start:auto}
.uhead{display:flex;align-items:center;gap:10px}
.uhead h2{font-size:16px;margin:0}
.ucard{background:var(--tp-white);border:1px solid var(--tp-gray-200);border-radius:10px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start}
.ucard .ub{flex:1;min-width:0}
.ucard .un{font-weight:700;color:var(--tp-navy);font-size:14px}
.ucard .uv{font-size:12px;color:var(--tp-text-muted);margin:2px 0 8px}
.ucard .ut{white-space:pre-wrap;font-size:13px;line-height:1.5;color:var(--tp-ink);max-height:240px;overflow:auto;user-select:text}
.ucard .ua{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tile.pp{background:var(--tp-navy);font-size:12px}
[dir=rtl] .ucard .un,[dir=rtl] .ucard .ut{unicode-bidi:plaintext;text-align:start}
</style>

<script>
"use strict";
var S = {}, items = [], self = null, sel = null, cat = "", busy = false, locked = false, icons = {}, shots = {}, shotsAsked = {};
var need = null;   // {q, order: [ids], reasons: {id: text}} while a search by need is shown
var mode = "store", ppu = null;   // C1.9.0: "updates" = only what waits for an update; ppu = the Power PDF update
var catalogLoaded = false;          // C1.9.2: the updates view says "nothing to update" only once the catalog is there
// customer codes (C0.8.0; a list since C1.4.1): list = [{code, name}], info[code] = {valid, customer, packages}
var code = { has: false, locked: false, customer: "", open: false, list: [], info: {} };
var author = "", authorList = "";   // C1.9.16: only the add-ons of one author
var CUST = "customer";   // chip key of the delivered add-ons (no category slug can look like this)
function customerName() {
  var names = [];
  items.forEach(function (i) { if (i.customer && names.indexOf(i.customer) < 0) names.push(i.customer); });
  if (!names.length) code.list.forEach(function (c) { if (c.name && names.indexOf(c.name) < 0) names.push(c.name); });
  return names.join(", ") || code.customer;
}
function maskCode(c) { return c.length > 10 ? c.slice(0, 4) + "\u2026" + c.slice(-4) : c; }
// the host sends {has, locked, list: [...]}; a bare list is accepted too (C1.4.5: the object
// was taken for the list, so the code dialog broke after adding a code)
function setCodes(c) {
  if (!c) return;
  if (Array.isArray(c)) c = { list: c };
  code.list = Array.isArray(c.list) ? c.list : [];
  code.has = code.list.length > 0;
  if (c.locked != null) code.locked = !!c.locked;
}
var host = window.chrome && window.chrome.webview;
function post(m) { if (host) host.postMessage(m); }
function $(id) { return document.getElementById(id); }
// C1.9.9: "Connects to" of an add-on: providers (website opens through the host, which only accepts
// addresses the catalog names) and the declared services; null when the version declares nothing
function connectsTo(x) {
  if (!x.connections || !S.connects) return null;
  var c; try { c = JSON.parse(x.connections); } catch (e) { return null; }
  if (!c || typeof c !== "object") return null;
  var prov = Array.isArray(c.p) ? c.p.slice(0, 5) : [], svc = Array.isArray(c.s) ? c.s.slice(0, 12) : [];
  if (!prov.length && !svc.length) return null;   // C1.9.10: nothing for an add-on that connects nowhere
  var box = el("div", "conn"); box.appendChild(el("b", "ct", S.connects));
  if (prov.length) {
    var pl = el("div", "cprov"); pl.appendChild(document.createTextNode(S.connProvider + ": "));
    var shown = 0;
    prov.forEach(function (p) {
      if (!p || typeof p.n !== "string") return;
      if (shown++) pl.appendChild(document.createTextNode(", "));
      if (typeof p.w === "string" && /^https:\/\/[^\s"<>\\@]+$/.test(p.w)) {
        var a = el("a", "link", p.n); a.title = p.w; a.href = "#";
        a.onclick = function (ev) { ev.preventDefault(); post({ cmd: "site", id: x.id, url: p.w }); };
        pl.appendChild(a);
      } else pl.appendChild(document.createTextNode(p.n));
    });
    box.appendChild(pl);
  }
  if (svc.length) {
    var ul = el("ul");
    svc.forEach(function (s) {
      if (!s) return;
      var li = el("li");
      if (typeof s.n === "string" && s.n) li.appendChild(el("span", "cn", s.n));
      if (typeof s.h === "string" && s.h) li.appendChild(el("code", "", s.h));
      if (typeof s.d === "string" && s.d) li.appendChild(el("span", "cd", (S.connData ? S.connData + ": " : "") + s.d));
      ul.appendChild(li);
    });
    box.appendChild(ul);
  }
  if (svc.length) box.appendChild(el("div", "cnote", S.connNote));   // only what the package declares
  return box;

function closeModal() { code.open = false; $("veil").classList.remove("on"); $("modal").classList.remove("wide"); $("modal").classList.remove("mid"); }

function reportForm(x) {

  m.appendChild(el("h3", "", S.report + ": " + x.name));

function busyModal(text) { var m = $("modal"); m.textContent = ""; m.appendChild(el("div", "spin")); var p = el("p", "", text); p.style.textAlign = "center"; m.appendChild(p); $("veil").classList.add("on"); }

// Add-ons from an earlier Power PDF folder (C1.1.4): installed one after the

var migQueue = null, migDone = 0;
var newsShown = false;   // "What's new" once per store window (C1.2.0)
function migNext() {
  if (!migQueue || !migQueue.length) {
    var n = migDone; migQueue = null; migDone = 0;
    if (n) modal("", fmt(S.migrateDone, n), [{ label: S.later, sec: true }, { label: S.restartNow, fn: function () { post({ cmd: "restart" }); } }]);
    return;

  post({ cmd: "install", id: it.id });

function onResult(m) {

    if (m.ok) { migDone++; migNext(); return; }
    var n = migDone; migQueue = null; migDone = 0;
    modal(m.title || "", m.message || "", [{ label: S.close, fn: function () { if (n) modal("", fmt(S.migrateDone, n), [{ label: S.later, sec: true }, { label: S.restartNow, fn: function () { post({ cmd: "restart" }); } }]); } }]);
    return;
  }
  if (m.ok && m.restart) {
    modal(m.title || "", m.message, [{ label: S.later, sec: true }, { label: S.restartNow, fn: function () { post({ cmd: "restart" }); } }]);
  } else if (m.message) {
    modal(m.title || "", m.message, [{ label: S.close }]);
  }

function apply(m) {

    if (m.lang) document.documentElement.lang = m.lang;   // C1.9.11: picks the kit font for CJK and Arabic
    $("title").textContent = S.title; document.title = S.title;
    $("q").placeholder = S.search; $("q").title = S.needHint || "";
    $("q").setAttribute("aria-label", S.search);
    $("needAll").textContent = S.needAll || "";
    $("needAll").onclick = clearNeed;
    $("disc").textContent = S.disclaimer; $("disc").title = S.disclaimer;
    $("discLink").textContent = S.disclaimerBtn;
    $("discLink").onclick = function () { modal(S.disclaimerBtn, S.disclaimerFull, [{ label: S.close }]); };
    $("reportStore").textContent = S.reportStore || "";

    $("migBtn").textContent = S.migrateBtn || ""; $("migLater").textContent = S.later || "";
    $("blkBtn").textContent = S.blockedBtn || "";

    $("migLater").onclick = function () { $("mig").style.display = "none"; post({ cmd: "migrateDismiss" }); };
    $("updBtn").textContent = S.selfUpdateBtn;
    $("updBtn").onclick = function () { busyModal(S.selfUpdateBtn); post({ cmd: "selfUpdate" }); };

    codeButton();

function clearNeed() { need = null; $("need").style.display = "none"; render(); }
